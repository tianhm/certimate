name: "GitHub Pull Requests Checker"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  pr-guard:
    if: >
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/pr-check')
    runs-on: ubuntu-latest
    steps:
      - name: Log
        run: |
          echo "Triggered by @${{ github.event.comment.user.login }}"
          echo "On PR #${{ github.event.issue.number }}"
      - name: Get PR details
        id: pr_details
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("git_head_ref", pr.head.ref);
            core.setOutput("git_head_sha", pr.head.sha);
            console.log(`git head ref: ${pr.head.ref}, sha: ${pr.head.sha}`);
    outputs:
      git_head_ref: ${{ steps.pr_details.outputs.git_head_ref }}
      git_head_sha: ${{ steps.pr_details.outputs.git_head_sha }}
      no_compile: ${{ contains(github.event.comment.body, 'no-compile') }}
      no_test: ${{ contains(github.event.comment.body, 'no-test') }}
      no_lint: ${{ contains(github.event.comment.body, 'no-lint') }}

  compile-build:
    if: needs.pr-guard.outputs.no_compile != 'true'
    name: "Compile Tests"
    needs: pr-guard
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: matrix.os == 'ubuntu-latest'
        name: Initialize GitHub Actions status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ needs.pr-guard.outputs.git_head_sha }}",
              state: "pending",
              context: "pr-check/compile-build",
              description: "Running...",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr-guard.outputs.git_head_ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Check dependencies (Node.js)
        run: |
          npm --prefix=./ui ci

      - name: Build (Node.js)
        run: |
          npm --prefix=./ui run build

      - name: Build (Go)
        env:
          CGO_ENABLED: 0
        run: |
          go build -v -ldflags "-s -w" -trimpath -o ./dist/certimate ./

  unit-test:
    if: needs.pr-guard.outputs.no_test != 'true'
    name: "Unit Tests"
    needs: pr-guard
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - if: matrix.os == 'ubuntu-latest'
        name: Initialize GitHub Actions status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ needs.pr-guard.outputs.git_head_sha }}",
              state: "pending",
              context: "pr-check/unit-test",
              description: "Running...",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr-guard.outputs.git_head_ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Run unit tests (Go, on Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          # Exclude packages below:
          MODULE=$(go list -m)
          EXCLUDES=(
            "${MODULE}/pkg/core/certmgr/providers/"
            "${MODULE}/pkg/core/deployer/providers/"
            "${MODULE}/pkg/core/notifier/providers/"
            "${MODULE}/pkg/sdk3rd-forked/"
            "${MODULE}/pkg/sdk3rd-trimmed/"
          )

          PKGS=$(go list ./...)
          for ex in "${EXCLUDES[@]}"; do
            PKGS=$(echo "$PKGS" | grep -v "^${ex}")
          done

          echo "Testing packages:"
          echo "$PKGS"

          if ! go test -race -v $PKGS; then
            echo "::error::Failed to run 'go test', please fix the issues above." >&2
            exit 1
          fi

      - name: Run unit tests (Go, on Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Exclude packages below:
          $MODULE = go list -m
          $EXCLUDES = @(
            "$MODULE/pkg/core/certmgr/providers/"
            "$MODULE/pkg/core/deployer/providers/"
            "$MODULE/pkg/core/notifier/providers/"
            "$MODULE/pkg/sdk3rd-forked/"
            "$MODULE/pkg/sdk3rd-trimmed/"
          )

          $PKGS = go list ./...
          foreach ($ex in $EXCLUDES) {
            $PKGS = $PKGS | Where-Object { $_ -notmatch "^$ex" }
          }

          Write-Host "Testing packages:"
          Write-Host ($PKGS -join "`n")

          go test -race -v $PKGS
          if ($LASTEXITCODE -ne 0) {
            Write-Error "::error::Failed to run 'go test', please fix the issues above."
            exit 1
          }
        shell: pwsh

  lint-format:
    if: needs.pr-guard.outputs.no_lint != 'true'
    name: "Lint & Format"
    needs: pr-guard
    runs-on: ubuntu-latest
    steps:
      - name: Initialize GitHub Actions status
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ needs.pr-guard.outputs.git_head_sha }}",
              state: "pending",
              context: "pr-check/lint-format",
              description: "Running...",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr-guard.outputs.git_head_ref }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Lint codes (Node.js)
        run: |
          cd ui
          npm ci
          npx eslint . --ext .js,.jsx,.ts,.tsx | grep "error"

      - name: Format codes (Node.js)
        run: |
          cd ui
          npm ci
          npx eslint . --fix --ext .js,.jsx,.ts,.tsx

          if ! git diff --quiet; then
            echo "::error::Running 'eslint' resulted in changes, please format files and commit them:"
            git diff --exit-code
            exit 1
          fi

      - name: Lint codes (Go)
        run: |
          # Exclude paths below:
          EXCLUDES=(
            "./pkg/sdk3rd-forked/"
            "./pkg/sdk3rd-trimmed/"
          )

          PKGS=$(go list ./... | grep -Ev $(IFS='|'; echo "${EXCLUDES[*]}"))
          echo "Linting packages:"
          echo "$PKGS"

          if ! echo "$PKGS" | xargs go vet; then
            echo "::error::Failed to run 'go vet', please fix the issues above"
            exit 1
          fi

      - name: Format codes (Go)
        run: |
          go install mvdan.cc/gofumpt@latest

          # Exclude paths below:
          EXCLUDES=(
            "./pkg/sdk3rd-forked/"
            "./pkg/sdk3rd-trimmed/"
            "./ui/"
            "./vendor/"
          )

          FIND_GO_FILES=()
          for ex in "${EXCLUDES[@]}"; do
            FIND_GO_FILES+=(-path "${ex}*" -prune -o)
          done

          GO_FILES="$(
            find . \
              "${FIND_GO_FILES[@]}" \
              -type f -name "*.go" \
              -print
          )"

          echo "Formatting files:"
          echo "$GO_FILES"

          echo "$GO_FILES" | while IFS= read -r f; do
            gofumpt -l -w "$f"
          done

          if ! git diff --quiet; then
            echo "::error::Running 'gofumpt' resulted in changes, please format files and commit them:"
            git diff --exit-code
            exit 1
          fi

  ending:
    name: "Ending"
    needs: [pr-guard, compile-build, unit-test, lint-format]
    if: always() && needs.pr-guard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Compute overall state
        id: state
        run: |
          # 最终状态：
          #  - 任一失败 → failure
          #  - 任一手动取消/超时 → cancelled
          #  - 全部成功 → success
          RESULTS="${{ needs.compile-build.result }} ${{ needs.unit-test.result }} ${{ needs.lint-format.result }}"
          if echo "$RESULTS" | grep -q "failure\|error"; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          elif echo "$RESULTS" | grep -q "cancelled"; then
            echo "state=cancelled" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Set GitHub Actions status
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              {
                ctx: "pr-check/compile-build",
                result: "${{ needs.compile-build.result }}",
                skipped: "${{ needs.pr-guard.outputs.no_compile }}",
              },
              {
                ctx: "pr-check/unit-test",
                result: "${{ needs.unit-test.result }}",
                skipped: "${{ needs.pr-guard.outputs.no_test }}",
              },
              {
                ctx: "pr-check/lint-format",
                result: "${{ needs.lint-format.result }}",
                skipped: "${{ needs.pr-guard.outputs.no_lint }}",
              },
            ];
            const states = {
              "success": "success",
              "failure": "failure",
              "cancelled": "error"
            };
            for (const j of jobs) {
              if (j.skipped === "true") continue;
              const state = states[j.result] || "error";
              const desc  = state === "success" ? "Passed"
                          : state === "failure" ? "Failed"
                          : "Cancelled";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: "${{ needs.pr-guard.outputs.git_head_sha }}",
                state: state,
                context: j.ctx,
                description: desc,
                target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            }
